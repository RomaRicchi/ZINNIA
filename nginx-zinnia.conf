# Configuración de Nginx para ZINNIA
# Archivo: /etc/nginx/sites-available/zinnia

# Upstream al contenedor Docker
upstream zinnia_backend {
    server 127.0.0.1:4321;
    keepalive 64;
}

# Servidor HTTP (redirige a HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name zinnia.tu-dominio.com;  # CAMBIAR POR TU DOMINIO

    # Opción 1: Si ya tienes HTTPS configurado, descomentar esto:
    # return 301 https://$server_name$request_uri;

    # Opción 2: Si aún NO tienes HTTPS, usar esto:
    location / {
        proxy_pass http://zinnia_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Para certbot (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

